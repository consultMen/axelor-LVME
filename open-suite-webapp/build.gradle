import com.axelor.gradle.tasks.CheckCredentialsInRptdesign
import com.axelor.gradle.tasks.CheckXmlDomainsAttributes
import com.axelor.gradle.tasks.CheckXmlImportsAttributes
import com.axelor.gradle.tasks.CheckXmlViewsAttributes
import com.axelor.gradle.tasks.GenerateAosChangelog
import com.axelor.gradle.tasks.CheckEOLCharsInCsv

plugins {
  id 'com.axelor.app'
  id 'war'
}

axelor {
  title "Axelor ERP"
  description "Axelor Entreprise Application"
}

allprojects {
  apply plugin: 'idea'
  apply plugin: 'eclipse'

  group = 'com.axelor.apps'
  version = '8.4.1'

  java {
    toolchain {
      languageVersion = JavaLanguageVersion.of(21)
    }
  }

  afterEvaluate {
    test {
      useJUnitPlatform()
      beforeTest { descriptor ->
        logger.lifecycle('Running: ' + descriptor)
      }
    }
  }

  configurations {
    runtimeClasspath.exclude group: "org.eclipse.birt.runtime.3_7_1", module: "org.apache.commons.codec"
    runtimeClasspath.exclude group: "org.eclipse.birt.runtime.3_7_1", module: "com.lowagie.text"
  }
}
ext {
    openSuiteVersion = '8.2.15' // Set to the available version
}
ext {
    axelorBiVersion = '3.3.0'
    axelorConnectVersion = '3.0.0'
    axelorOffice365Version = '8.2.0'
    axelorAdminVersion = '6.5.48'
}

tasks.withType(PublishToMavenRepository).configureEach { it.enabled = false }
configurations.all {
    resolutionStrategy {
        force 'org.apache.pdfbox:pdfbox:3.0.0'
    }
}
dependencies {
  // Exclude transitive snakeyaml from axelor-admin
  implementation("com.axelor.apps:axelor-admin:${axelorAdminVersion}") {
    exclude group: "org.yaml", module: "snakeyaml"
  }

  // Add the normal Snakeyaml (no -android classifier)
  implementation("org.yaml:snakeyaml:2.3")

  // Other dependencies
  implementation "com.axelor.addons:axelor-bi:${axelorBiVersion}"
  implementation "com.axelor.addons:axelor-connect:${axelorConnectVersion}"
  implementation "com.axelor.apps.enterprise:axelor-office-365:${axelorOffice365Version}"

  gradle.appModules.each { dir ->
    implementation project(":modules:$dir.name")
  }
}
apply from: 'gradle/style.gradle'
task("dataImport", type: JavaExec) {
  mainClass = "com.axelor.apps.erp.Main"
  classpath = sourceSets.main.runtimeClasspath
  if (System.getProperty("exec.args") != null) {
    args System.getProperty("exec.args").split()
  }
}
task archiveReports(type: Zip) {
  file("modules").traverse(type: groovy.io.FileType.DIRECTORIES, maxDepth: 1) { dir ->
    if (new File(dir, "build.gradle").exists() && new File(dir, "/src/main/resources/reports").exists()) {
      new File(dir, "/src/main/resources/reports/").listFiles().each { report ->
        from report.getPath()
      }
    }
  }

  archiveClassifier = 'reports'
  includeEmptyDirs = false
  destinationDirectory = file("$buildDir/libs")
}


task generateChangelog(type: GenerateAosChangelog) {
  group "Axelor application"
  description "Generate change logs from unreleased entries."
  files = fileTree(projectDir) {
    include '**/changelogs/**/*.yml'
    include '**/changelogs/**/*.yaml'
  }
}

task checkCsvEOL(type: CheckEOLCharsInCsv) {
  group "Axelor application"
  description "Check end-of-line characters in CSV files."
  files = fileTree(projectDir) {
    exclude '**/build'
    exclude '**/bin'
    exclude '**/out'
    include '**/*.csv'
  }
}

task checkBirtCredentials(type: CheckCredentialsInRptdesign) {
  group "Axelor application"
  description "Check if .rptdesign files (BIRT) contain credentials."
  files = fileTree(projectDir) {
    exclude '**/build'
    exclude '**/bin'
    exclude '**/out'
    include '**/*.rptdesign'
  }
}

task checkXmlDomainsAttributes(type: CheckXmlDomainsAttributes) {
  group "Axelor application"
  description "Verify errors in XML domain files."
  files = fileTree(projectDir) {
    exclude '**/build'
    exclude '**/bin'
    exclude '**/out'
    include '**/modules/**/src/main/resources/domains/*.xml'
  }
}

task checkXmlViewsAttributes(type: CheckXmlViewsAttributes) {
  group "Axelor application"
  description "Verify errors in XML view files."
  files = fileTree(projectDir) {
    exclude '**/build'
    exclude '**/bin'
    exclude '**/out'
    include '**/modules/**/src/main/resources/views/*.xml'
  }
}

task checkXmlImportsAttributes(type: CheckXmlImportsAttributes) {
  group "Axelor application"
  description "Verify errors in XML import files."
  files = fileTree(projectDir) {
    exclude '**/build'
    exclude '**/bin'
    exclude '**/out'
    include "**/modules/**/src/main/resources/apps/**/*.xml"
    include "**/modules/**/src/main/resources/data-import/*.xml"
    include "**/modules/**/src/main/resources/data-init/*.xml"
    include '**/modules/**/src/main/resources/import-configs/*.xml'
  }
}

task checkXml(dependsOn: ['checkXmlDomainsAttributes','checkXmlViewsAttributes', 'checkXmlImportsAttributes'])

// LVME : poignée pour réorganiser les lignes (listes de lignes des commandes…) placée en PREMIÈRE
// colonne au lieu de la dernière (demande client). Axelor 7.4 la place toujours en fin de ligne,
// sans option : on retouche l'interface d'Axelor juste après sa copie dans build/webapp.
// Si le code d'Axelor change (mise à jour), rien n'est modifié et un avertissement s'affiche.
tasks.named('copyWebapp') {
  doLast {
    def pattern = '(&&!([\\w$]+)\\.find\\(([\\w$]+)=>\\3\\.name==="__reorder__"\\)&&\\2)\\.push\\('
    def patched = 0
    fileTree("$buildDir/webapp/assets") { include 'index-*.js' }.each { f ->
      def text = f.getText('UTF-8')
      def updated = text.replaceAll(pattern) { all, head, list, item -> "${head}.unshift(" }
      if (updated != text) {
        f.write(updated, 'UTF-8')
        patched++
      }
    }
    if (patched == 0) {
      logger.warn('LVME : poignée de réorganisation non déplacée (code Axelor introuvable ou déjà modifié)')
    }

    // LVME : feuille de style des écrans façon GESCOM (src/main/webapp/css/lvme.css)
    def index = file("$buildDir/webapp/index.html")
    if (index.exists()) {
      def html = index.getText('UTF-8')
      if (!html.contains('css/lvme.css')) {
        html = html.replace('</head>', '    <link rel="stylesheet" href="./css/lvme.css">\n  </head>')
      }
      // LVME : raccourcis clavier (F1 = historique des prix) (src/main/webapp/js/lvme.js)
      if (!html.contains('js/lvme.js')) {
        html = html.replace('</head>', '    <script src="./js/lvme.js"></script>\n  </head>')
      }
      index.write(html, 'UTF-8')
    }
  }
}
war {
  archiveBaseName.set("axelor-erp")
  archiveVersion.set("8.2.3") // ou autre version
  destinationDirectory.set(file("$buildDir/libs"))
}
build.finalizedBy archiveReports
